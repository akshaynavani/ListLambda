AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ListLambda - serverless task management REST backend
  (Lambda + API Gateway + DynamoDB + S3 + SNS + CloudWatch).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowHeaderIdentity:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      When "true", the X-User-Id header is accepted as the caller identity when no JWT
      claims are present. Use only for dev and load testing.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to task.completed events.
  AllowedUploadOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed to PUT attachments directly to S3 (CORS).

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10
    CodeUri: src/
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref TasksTable
        ATTACHMENTS_BUCKET: !Sub listlambda-${Stage}-attachments-${AWS::AccountId}
        EVENTS_TOPIC_ARN: !Ref TaskEventsTopic

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub listlambda-${Stage}-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---- S3 ---------------------------------------------------------------------
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub listlambda-${Stage}-attachments-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: [!Ref AllowedUploadOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  StaticSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub listlambda-${Stage}-web-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  StaticSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticSiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${StaticSiteBucket.Arn}/*

  # ---- SNS --------------------------------------------------------------------
  TaskEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub listlambda-${Stage}-task-events
      KmsMasterKeyId: alias/aws/sns

  CompletedEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref TaskEventsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail
      FilterPolicy:
        event_type: [task.completed]

  # ---- API --------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [Content-Type, Authorization, X-User-Id, If-Match]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        ExposeHeaders: [ETag, Location]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2000
        ThrottlingRateLimit: 1000

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub listlambda-${Stage}-api
      Handler: listlambda.api.handler
      Environment:
        Variables:
          ALLOW_HEADER_IDENTITY: !Ref AllowHeaderIdentity
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - S3CrudPolicy:
            BucketName: !Sub listlambda-${Stage}-attachments-${AWS::AccountId}
      Events:
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /health, Method: GET }
        CreateTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks, Method: POST }
        ListTasks:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks, Method: GET }
        GetTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}, Method: GET }
        UpdateTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}, Method: PATCH }
        DeleteTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}, Method: DELETE }
        CompleteTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}/complete, Method: POST }
        RequestUpload:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}/attachments, Method: POST }
        ListAttachments:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}/attachments, Method: GET }
        GetAttachment:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/tasks/{task_id}/attachments/{attachment_id}", Method: GET }
        DeleteAttachment:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/tasks/{task_id}/attachments/{attachment_id}", Method: DELETE }

  # ---- event-driven functions ---------------------------------------------------
  AttachmentUploadedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub listlambda-${Stage}-attachment-uploaded
      Handler: listlambda.attachments.s3_handler
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        ObjectCreated:
          Type: S3
          Properties:
            Bucket: !Ref AttachmentsBucket
            Events: s3:ObjectCreated:*

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub listlambda-${Stage}-notifier
      Handler: listlambda.notifier.handler
      MemorySize: 256
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt TaskEventsTopic.TopicName
      Events:
        TableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TasksTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 5
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  TasksTableName:
    Value: !Ref TasksTable
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
  StaticSiteUrl:
    Value: !GetAtt StaticSiteBucket.WebsiteURL
  StaticSiteBucketName:
    Value: !Ref StaticSiteBucket
  TaskEventsTopicArn:
    Value: !Ref TaskEventsTopic
