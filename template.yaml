AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ListLambda - serverless task management REST backend
  (Lambda + API Gateway + DynamoDB + S3 + SNS + CloudWatch).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowHeaderIdentity:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      When "true", the X-User-Id header is accepted as the caller identity when no JWT
      claims are present. Use only for dev and load testing.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to task.completed events.
  AllowedUploadOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed to PUT attachments directly to S3 (CORS).

  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to CloudWatch alarm notifications.
  LatencyP99ThresholdMs:
    Type: Number
    Default: 100
  LogRetentionDays:
    Type: Number
    Default: 14

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  IsProd: !Equals [!Ref Stage, prod]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10
    CodeUri: src/
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        STAGE: !Ref Stage
        POWERTOOLS_SERVICE_NAME: listlambda
        POWERTOOLS_METRICS_NAMESPACE: ListLambda
        POWERTOOLS_LOG_LEVEL: !If [IsProd, INFO, DEBUG]
        POWERTOOLS_LOGGER_SAMPLE_RATE: "0.05"
        TABLE_NAME: !Ref TasksTable
        ATTACHMENTS_BUCKET: !Sub listlambda-${Stage}-attachments-${AWS::AccountId}
        EVENTS_TOPIC_ARN: !Ref TaskEventsTopic

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub listlambda-${Stage}-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---- S3 ---------------------------------------------------------------------
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub listlambda-${Stage}-attachments-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: [!Ref AllowedUploadOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  StaticSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub listlambda-${Stage}-web-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  StaticSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticSiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${StaticSiteBucket.Arn}/*

  # ---- SNS --------------------------------------------------------------------
  TaskEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub listlambda-${Stage}-task-events
      KmsMasterKeyId: alias/aws/sns

  CompletedEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref TaskEventsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail
      FilterPolicy:
        event_type: [task.completed]

  # ---- API --------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","routeKey":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","responseLength":"$context.responseLength"}'
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [Content-Type, Authorization, X-User-Id, If-Match]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        ExposeHeaders: [ETag, Location]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2000
        ThrottlingRateLimit: 1000

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub listlambda-${Stage}-api
      Handler: listlambda.api.handler
      Environment:
        Variables:
          ALLOW_HEADER_IDENTITY: !Ref AllowHeaderIdentity
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - S3CrudPolicy:
            BucketName: !Sub listlambda-${Stage}-attachments-${AWS::AccountId}
      Events:
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /health, Method: GET }
        CreateTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks, Method: POST }
        ListTasks:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks, Method: GET }
        GetTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}, Method: GET }
        UpdateTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}, Method: PATCH }
        DeleteTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}, Method: DELETE }
        CompleteTask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}/complete, Method: POST }
        RequestUpload:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}/attachments, Method: POST }
        ListAttachments:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /tasks/{task_id}/attachments, Method: GET }
        GetAttachment:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/tasks/{task_id}/attachments/{attachment_id}", Method: GET }
        DeleteAttachment:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/tasks/{task_id}/attachments/{attachment_id}", Method: DELETE }

  # ---- event-driven functions ---------------------------------------------------
  AttachmentUploadedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub listlambda-${Stage}-attachment-uploaded
      Handler: listlambda.attachments.s3_handler
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        ObjectCreated:
          Type: S3
          Properties:
            Bucket: !Ref AttachmentsBucket
            Events: s3:ObjectCreated:*

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub listlambda-${Stage}-notifier
      Handler: listlambda.notifier.handler
      MemorySize: 256
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt TaskEventsTopic.TopicName
      Events:
        TableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TasksTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 5
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]

  # ---- CloudWatch: logs -------------------------------------------------------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/listlambda-${Stage}-access
      RetentionInDays: !Ref LogRetentionDays

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/listlambda-${Stage}-api
      RetentionInDays: !Ref LogRetentionDays

  NotifierFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/listlambda-${Stage}-notifier
      RetentionInDays: !Ref LogRetentionDays

  AttachmentUploadedFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/listlambda-${Stage}-attachment-uploaded
      RetentionInDays: !Ref LogRetentionDays

  # ---- CloudWatch: alarms -----------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub listlambda-${Stage}-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ApiLatencyP99Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-api-latency-p99
      AlarmDescription: API p99 latency above target
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
        - { Name: Stage, Value: !Ref Stage }
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref LatencyP99ThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-api-5xx-rate
      AlarmDescription: More than 1% of API requests returned 5xx
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5xx
              Dimensions:
                - { Name: ApiId, Value: !Ref HttpApi }
                - { Name: Stage, Value: !Ref Stage }
            Period: 60
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - { Name: ApiId, Value: !Ref HttpApi }
                - { Name: Stage, Value: !Ref Stage }
            Period: 60
            Stat: Sum
        - Id: rate
          Expression: "IF(requests > 0, 100 * errors / requests, 0)"
          Label: 5xx rate (%)
          ReturnData: true
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-api-function-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-api-function-throttles
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NotifierIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-notifier-iterator-age
      AlarmDescription: Notifier is falling behind the DynamoDB stream
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [{ Name: FunctionName, Value: !Ref NotifierFunction }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NotifierPublishFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-event-publish-failures
      Namespace: ListLambda
      MetricName: EventPublishFailures
      Dimensions: [{ Name: service, Value: listlambda }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  TableWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-dynamodb-write-throttles
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions: [{ Name: TableName, Value: !Ref TasksTable }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  TableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub listlambda-${Stage}-dynamodb-read-throttles
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions: [{ Name: TableName, Value: !Ref TasksTable }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  TasksTableName:
    Value: !Ref TasksTable
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
  StaticSiteUrl:
    Value: !GetAtt StaticSiteBucket.WebsiteURL
  StaticSiteBucketName:
    Value: !Ref StaticSiteBucket
  TaskEventsTopicArn:
    Value: !Ref TaskEventsTopic
  AlarmTopicArn:
    Value: !Ref AlarmTopic
